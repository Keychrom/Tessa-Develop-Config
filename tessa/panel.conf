# Tessa Panel - Vermilion Ink
# Panel-only settings. Loaded after ~/.config/tessa/config.
# Reload with Super+R or `tessa-ctl dispatch reload`.

# Shell / panel --------------------------------------------------------------
# Unified control center; change to classic for separate popovers.
panel_style = unified
control_features = all
bar_height = 46
bar_top_margin = 14
bar_side_margin = 18
bar_layout = logo,workspaces,chips,clock,battery,network,volume,stats,media,tray,status
bar-font = Inter
launcher-font = Inter
popover-font = Inter
toast-font = Inter
bar-fg = #f0eadf
launcher-fg = #f3ede3
popover-fg = #f3ede3
toast-fg = #f3ede3
bar-bg = #0b111b
launcher-bg = #0a101a
popover-bg = #0a101a
toast-bg = #101826
panel_bg = #0b111b
panel_fg = #f0eadf
font = Inter

# Wallpaper ------------------------------------------------------------------
wallpaper_image = ~/Pictures/Wallpapers/vermilion-ink.png
wallpaper_fit = cover
wallpaper_art = false

# Applications ---------------------------------------------------------------
screenshot_dir = ~/Pictures/Screenshots

launcher_entry = Terminal | kitty
launcher_entry = Browser | firefox
launcher_entry = System Info | kitty --hold -e fastfetch
launcher_entry = Fcitx5 Settings | fcitx5-configtool
launcher_entry = Tessa WM Config | kitty -e sh -c '${EDITOR:-vi} ~/.config/tessa/config'
launcher_entry = Tessa Panel Config | kitty -e sh -c '${EDITOR:-vi} ~/.config/tessa/panel.conf'
