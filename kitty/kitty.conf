# Tessa Ink — Kitty
# Vermilion Ink palette, JetBrains Mono Nerd Font, powerline tabs.
# Reload: Ctrl+Shift+F5 (or restart kitty)

# Typography -----------------------------------------------------------------
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.5
modify_font      cell_height 112%
disable_ligatures never

# Japanese falls back to Noto CJK (JP variants) instead of a random CJK font.
symbol_map U+3000-U+30FF,U+3400-U+4DBF,U+4E00-U+9FFF,U+F900-U+FAFF Noto Sans Mono CJK JP

# Window ---------------------------------------------------------------------
remember_window_size  no
initial_window_width  1100
initial_window_height 700
placement_strategy    center
window_padding_width  14 18
hide_window_decorations no
confirm_os_window_close 0
background_opacity    0.82
dynamic_background_opacity yes
focus_follows_mouse   no
mouse_hide_wait       2.0

# Scrolling ------------------------------------------------------------------
scrollback_lines 12000
scrollbar        scrolled
scrollbar_width 0.6
scrollbar_gap   0.2
scrollbar_radius 0.4
scrollbar_handle_color #e2684f
scrollbar_track_color  #101826
wheel_scroll_multiplier 4.0
touch_scroll_multiplier 2.0
copy_on_select   clipboard
strip_trailing_spaces smart

# Cursor ---------------------------------------------------------------------
cursor_shape             beam
cursor_beam_thickness    2.0
cursor_blink_interval    0.55
cursor_stop_blinking_after 20.0
cursor_trail             180
cursor_trail_decay       0.08 0.25

# Bell / notifications -------------------------------------------------------
enable_audio_bell no
visual_bell_duration 0.12
visual_bell_color #e2684f
window_alert_on_bell yes
bell_on_tab "◆ "

# Tabs -----------------------------------------------------------------------
tab_bar_edge            bottom
tab_bar_style           powerline
tab_powerline_style     slanted
tab_bar_align           left
tab_bar_min_tabs        1
tab_bar_margin_width    10
tab_bar_margin_height   6 0
tab_title_template      "{index}  {title}"
active_tab_font_style   bold
inactive_tab_font_style normal
tab_switch_strategy     previous
tab_bar_background      #070a12
tab_bar_margin_color    #070a12
active_tab_background   #e2684f
active_tab_foreground   #0b111b
inactive_tab_background #101826
inactive_tab_foreground #93a3b8

# Palette --------------------------------------------------------------------
background            #0b111b
foreground            #e9e2d6
selection_background  #e2684f
selection_foreground  #0b111b
cursor                #e2684f
cursor_text_color     #0b111b
url_color             #e8bc7d
url_style             curly
active_border_color   #e2684f
inactive_border_color #26313f
bell_border_color     #d9a45b

color0  #131c29
color8  #3a4a5e
color1  #e2684f
color9  #f0836c
color2  #7fa98b
color10 #97c2a2
color3  #d9a45b
color11 #e8bc7d
color4  #6e8fb5
color12 #8fafd3
color5  #b080a8
color13 #c99bc2
color6  #6faeb3
color14 #8ccbd0
color7  #c9d1d9
color15 #f4eee4

mark1_background #e2684f
mark1_foreground #0b111b
mark2_background #d9a45b
mark2_foreground #0b111b
mark3_background #6faeb3
mark3_foreground #0b111b

# Shell integration ----------------------------------------------------------
shell_integration enabled
allow_remote_control socket-only
detect_urls       yes
open_url_with     default
update_check_interval 0

# Keybindings ----------------------------------------------------------------
map ctrl+shift+enter        new_window_with_cwd
map ctrl+shift+n            new_os_window_with_cwd
map ctrl+shift+t            new_tab_with_cwd
map ctrl+shift+left         previous_tab
map ctrl+shift+right        next_tab
map ctrl+shift+alt+left     move_tab_backward
map ctrl+shift+alt+right    move_tab_forward
map ctrl+shift+equal        increase_font_size
map ctrl+shift+minus        decrease_font_size
map ctrl+shift+backspace    restore_font_size
map ctrl+shift+h            launch --type=overlay kitten hints
map ctrl+shift+o            launch --type=overlay kitten unicode_input
map ctrl+shift+f            launch --type=overlay --title "Fonts" kitten choose-fonts
map ctrl+shift+alt+enter    launch --type=overlay --title "System" sh -c "fastfetch; printf '\\nPress Enter to close'; read _"

# Tessa bar is on top; keep kitty's own chrome out of the way.
window_border_width 0
draw_minimal_borders no
